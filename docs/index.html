<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebRTC Pong — Serverless P2P Multiplayer Pong</title><meta name="title" content="WebRTC Pong — Serverless P2P Multiplayer Pong"><meta name="description" content="Play serverless peer-to-peer multiplayer Pong in your browser. Built with WebRTC and Trystero—host a room, share a room code or invite link, and play with zero backend."><meta name="keywords" content="WebRTC Pong, P2P Pong, serverless multiplayer, Trystero, browser game, peer-to-peer game, HTML5 canvas pong"><meta name="author" content="ar00n"><meta name="theme-color" content="#121212"><link rel="canonical" href="https://ar00n.github.io/webrtc-pong/"><meta property="og:type" content="website"><meta property="og:site_name" content="WebRTC Pong"><meta property="og:url" content="https://ar00n.github.io/webrtc-pong/"><meta property="og:title" content="WebRTC Pong — Serverless P2P Multiplayer Pong"><meta property="og:description" content="Serverless P2P multiplayer Pong built with WebRTC & Trystero. Host a game, share a room code or invite link, and play directly peer-to-peer."><meta property="og:image" content="https://ar00n.github.io/webrtc-pong/social-preview.png"><meta property="og:image:alt" content="WebRTC Pong — Serverless P2P Multiplayer Pong gameplay and room controls"><meta property="og:image:width" content="1280"><meta property="og:image:height" content="640"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:url" content="https://ar00n.github.io/webrtc-pong/"><meta name="twitter:title" content="WebRTC Pong — Serverless P2P Multiplayer Pong"><meta name="twitter:description" content="Serverless P2P multiplayer Pong built with WebRTC & Trystero. Host a room, share a code or invite link, and play in real time."><meta name="twitter:image" content="https://ar00n.github.io/webrtc-pong/social-preview.png"><meta name="twitter:image:alt" content="WebRTC Pong — Serverless P2P Multiplayer Pong gameplay and room controls"><link rel="stylesheet" href="styles.min.css"></head><body><main class="app"><section class="panel" aria-label="Game controls and connection status"><header class="header"><strong>WebRTC Pong (Room Codes)</strong><div class="status-wrap"><span id="dot" class="dot" aria-hidden="true"></span> <span id="status" class="status" role="status" aria-live="polite">Host a room or join with a code </span><span id="pingBadge" class="ping-badge hidden">-- ms</span></div></header><div id="lobbyBox"><div class="row"><button id="btnHost" type="button">Host Game (Left Paddle)</button> <span class="status">or</span> <input id="joinCodeInput" type="text" maxlength="12" placeholder="CODE" autocomplete="off" aria-label="Room code"> <button id="btnJoin" type="button">Join Game</button></div><p id="lobbyError" class="inline-error hidden" role="alert"></p></div><div id="roomBox" class="hidden"><div id="inviteArea"><p class="status invite-label">Share this room code or invite link with your friend:</p><div class="code-box"><span id="roomCodeDisplay" class="code-text">-----</span> <button id="btnCopyCode" type="button" class="secondary">Copy Code</button> <button id="btnCopyLink" type="button">Copy Invite Link</button></div></div><div class="row"><button id="btnPause" type="button" class="secondary" disabled="disabled">Pause (Space)</button> <button id="btnResetScore" type="button" class="secondary hidden">Reset Score</button> <button id="btnLeave" type="button" class="danger">Leave Room</button></div></div><div class="settings-bar"><div id="hostSettingsControls" class="settings-controls"><label class="inline-field"><span class="field-label">Difficulty</span> <select id="difficultySelect" aria-label="Difficulty"><option value="easy">Easy</option><option value="normal">Normal</option><option value="hard">Hard</option><option value="custom">Custom</option></select></label> <label class="inline-field"><span class="field-label">Mode</span> <select id="modeSelect" aria-label="Game mode"><option value="first-to">First to X</option><option value="win-by-2">Win by 2</option><option value="timed">Timed</option><option value="endless">Endless</option></select></label> <label id="targetScoreWrap" class="inline-field"><span class="field-label">Points</span> <input id="targetScoreInput" type="number" min="1" max="99" step="1" value="7" aria-label="Target points"></label> <label id="timeLimitWrap" class="inline-field hidden"><span class="field-label">Time</span> <select id="timeLimitSelect" aria-label="Match duration"><option value="30">0:30</option><option value="60">1:00</option><option value="120">2:00</option><option value="180">3:00</option><option value="300">5:00</option><option value="600">10:00</option></select></label> <span id="difficultySpec" class="spec-text"></span></div><div id="customDifficultyRow" class="custom-diff-row hidden"><label class="inline-field"><span class="field-label">Serve Speed</span> <input id="customInitialSpeedInput" type="number" min="200" max="600" step="10" value="340" aria-label="Custom serve speed"></label> <label class="inline-field"><span class="field-label">Max Speed</span> <input id="customMaxSpeedInput" type="number" min="450" max="1600" step="20" value="1000" aria-label="Custom max ball speed"></label> <label class="inline-field"><span class="field-label">Multiplier</span> <input id="customMultiplierInput" type="number" min="1.00" max="1.20" step="0.01" value="1.05" aria-label="Custom speed multiplier"></label></div><div id="guestSettingsBanner" class="rules-badge hidden">Match Rules: <strong id="guestRulesSummary">Normal • First to 7</strong></div></div><div class="paddle-bar"><span class="field-label">Paddle Colour</span><div id="paddleColorPalette" class="color-palette" role="group" aria-label="Select paddle colour"></div><span id="opponentColorBadge" class="opponent-color hidden">Opponent: <span id="opponentColorDot" class="opponent-dot" aria-hidden="true"></span> <span id="opponentColorName">Classic White</span></span></div><div class="audio-bar"><div class="audio-group"><button id="btnMute" type="button" class="secondary small" title="Toggle Mute (M)">Sound: On (M)</button> <input id="volumeSlider" type="range" min="0" max="100" value="70" aria-label="Volume"> <span id="volumeValue" class="vol-text">70%</span></div><div class="win-sound-controls"><label class="inline-field"><span class="field-label">Win Sound</span> <select id="winSoundSelect" aria-label="Win sound selection"></select></label> <button id="btnPreviewWinSound" type="button" class="secondary small">Preview</button></div></div></section><canvas id="game" width="700" height="420" aria-label="Pong game board"></canvas><p class="status controls-hint">Controls: Mouse / Touch drag, W/S or Arrow Up &amp; Down, Space to Pause / Resume, M to Mute</p></main><script src="app.min.js" defer="defer"></script></body></html>
